name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src-tauri/py_backend/requirements.txt

      - name: Install npm dependencies
        run: pnpm install

      - name: Install Python dependencies
        working-directory: src-tauri/py_backend
        run: pip install -r requirements.txt

      - name: Install macOS build deps
        if: matrix.os == 'macos-latest'
        run: brew install cmake libomp

      - name: Download sherpa-onnx prebuilt libs (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -ex
          SHERPA_TAG=v1.13.3
          SHERPA_PKG=sherpa-onnx-${SHERPA_TAG}-win-x64-static-MD-Release-lib
          mkdir -p src-tauri/target/sherpa-onnx-prebuilt
          curl -fL -o src-tauri/target/sherpa-onnx-prebuilt/${SHERPA_PKG}.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_TAG}/${SHERPA_PKG}.tar.bz2
          cd src-tauri/target/sherpa-onnx-prebuilt
          tar -xjf ${SHERPA_PKG}.tar.bz2
          ls -la ${SHERPA_PKG}/lib/*.lib
          echo "SHERPA_ONNX_LIB_DIR=$(pwd)/${SHERPA_PKG}/lib" >> $GITHUB_ENV

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          RUSTFLAGS: ""
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/*/*
          generate_release_notes: true
