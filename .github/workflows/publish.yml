name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src-tauri/py_backend/requirements.txt

      - name: Install npm dependencies
        run: pnpm install

      - name: Install Python dependencies
        working-directory: src-tauri/py_backend
        run: pip install -r requirements.txt

      - name: Install macOS build deps
        if: matrix.os == 'macos-latest'
        run: brew install cmake libomp

      - name: Build agent binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pip install pyinstaller
          cd src-tauri/py_backend
          pyinstaller --onefile --name easywork-agent --distpath ../binaries main.py \
            --add-data "data:data" --add-data "llm:llm" --add-data "tools:tools" \
            --hidden-import uvicorn --hidden-import httpx --hidden-import aiosqlite \
            --hidden-import tiktoken --hidden-import openpyxl --hidden-import pandas \
            --hidden-import pydantic --hidden-import yaml --hidden-import xlrd \
            --exclude matplotlib --exclude IPython --exclude PyQt5 --exclude PySide6 \
            --noconfirm --clean -p .

      - name: Build agent binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call pip install pyinstaller
          cd /d src-tauri\py_backend
          pyinstaller --onefile --name easywork-agent --distpath ..\binaries main.py --add-data "data;data" --add-data "llm;llm" --add-data "tools;tools" --hidden-import uvicorn --hidden-import httpx --hidden-import aiosqlite --hidden-import tiktoken --hidden-import openpyxl --hidden-import pandas --hidden-import pydantic --hidden-import yaml --hidden-import xlrd --exclude matplotlib --exclude IPython --exclude PyQt5 --exclude PySide6 --noconfirm --clean -p .

      - name: Download sherpa-onnx MD prebuilt libs (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $pkg = "sherpa-onnx-v1.13.3-win-x64-static-MD-Release-lib"
          $libdir = "${{ github.workspace }}\src-tauri\target\sherpa-onnx-prebuilt\$pkg\lib"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\src-tauri\target\sherpa-onnx-prebuilt"
          curl.exe -fL -o "${{ github.workspace }}\src-tauri\target\sherpa-onnx-prebuilt\$pkg.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/$pkg.tar.bz2"
          tar -xjf "${{ github.workspace }}\src-tauri\target\sherpa-onnx-prebuilt\$pkg.tar.bz2" -C "${{ github.workspace }}\src-tauri\target\sherpa-onnx-prebuilt"
          echo "SHERPA_ONNX_LIB_DIR=$libdir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          RUSTFLAGS: ""
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}

      - name: Sign installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/tauri-key.pem
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            installer=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          else
            installer=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          fi
          signature=$(npx tauri signer sign --private-key /tmp/tauri-key.pem \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$installer")
          echo "$signature" > "${installer}.sig"
          echo "SIGNATURE=$(echo "$signature" | tr -d '\n')" >> $GITHUB_ENV

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/*/*
          generate_release_notes: true
