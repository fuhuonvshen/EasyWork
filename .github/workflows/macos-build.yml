name: macOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm i

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: src-tauri/py_backend
        run: pip install -r requirements.txt

      - name: Install macOS build deps
        run: |
          brew install cmake libomp

      - name: Build agent binary with PyInstaller
        run: |
          pip install pyinstaller
          cd src-tauri/py_backend
          pyinstaller --onefile --name easywork-agent --distpath ../binaries main.py \
            --add-data "data:data" --add-data "llm:llm" --add-data "tools:tools" \
            --hidden-import uvicorn --hidden-import httpx --hidden-import aiosqlite \
            --hidden-import tiktoken --hidden-import openpyxl --hidden-import pandas \
            --hidden-import pydantic --hidden-import yaml --hidden-import xlrd \
            --exclude matplotlib --exclude IPython --exclude PyQt5 --exclude PySide6 \
            --noconfirm --clean -p .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: npm run tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          RUST_BACKTRACE: 1

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: EasyWork-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
