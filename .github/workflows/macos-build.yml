name: macOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: src-tauri/py_backend
        run: pip install -r requirements.txt

      - name: Install macOS build deps
        run: |
          brew install cmake libomp

      - name: Build agent binary with PyInstaller
        run: |
          pip install pyinstaller
          cd src-tauri
          pyinstaller --onefile --name easywork-agent --distpath binaries agent_launcher.py \
            --add-data "py_backend:py_backend" \
            --collect-all lxml \
            --hidden-import uvicorn --hidden-import httpx --hidden-import aiosqlite \
            --collect-all tiktoken --collect-all tiktoken_ext --hidden-import openpyxl --hidden-import pandas \
            --hidden-import pydantic --hidden-import yaml --hidden-import xlrd \
            --hidden-import email.mime.text --hidden-import email.mime.multipart --hidden-import email.mime.base \
            --hidden-import py_backend.tools.sandbox --hidden-import py_backend.tools.file_preview \
            --hidden-import py_backend.tools.handlers.email \
            --hidden-import py_backend.tools.handlers.execute_python \
            --hidden-import py_backend.tools.handlers.todo \
            --hidden-import py_backend.tools.handlers.xlsx \
            --exclude matplotlib --exclude IPython --exclude PyQt5 --exclude PySide6 \
            --noconfirm --clean -p .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          RUST_BACKTRACE: 1

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: EasyWork-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
